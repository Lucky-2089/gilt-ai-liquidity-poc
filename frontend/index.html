<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Liquidity Provider Demo</title>
    <link rel="stylesheet" href="/static/style.css">>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI-Powered Gilt Trading</h1>
            <p>Instant liquidity with AI-powered pricing on Canton DLT</p>
        </header>

        <div class="trading-panel">
            <div class="form-section">
                <h2>Request Quote</h2>
                <div class="form-group">
                    <label for="isin-select">Select Gilt:</label>
                    <select id="isin-select">
                        <option value="GB00B1234567">UK Treasury 5Y Gilt (GB00B1234567)</option>
                        <option value="GB00B4567890">UK Treasury 10Y Gilt (GB00B4567890)</option>
                        <option value="GB00B9999999">UK Corporate Gilt (GB00B9999999)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Trade Type:</label>
                    <div class="radio-group">
                        <input type="radio" id="buy-radio" name="trade-type" value="buy" checked>
                        <label for="buy-radio">Buy</label>

                        <input type="radio" id="sell-radio" name="trade-type" value="sell">
                        <label for="sell-radio">Sell</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="quantity-input">Quantity:</label>
                    <input type="number" id="quantity-input" value="1" min="1">
                </div>

                <button id="quote-btn">Get AI Quote</button>
            </div>

            <div class="quote-section" id="quote-section" style="display: none;">
                <h2>AI-Generated Quote</h2>
                <div class="quote-details">
                    <p><strong>ISIN:</strong> <span id="quote-isin"></span></p>
                    <p><strong>Side:</strong> <span id="quote-side"></span></p>
                    <p><strong>Quantity:</strong> <span id="quote-quantity"></span></p>
                    <p><strong>Price per unit:</strong> £<span id="quote-price"></span></p>
                    <p><strong>Total value:</strong> £<span id="quote-total"></span></p>
                    <p><strong>Expires:</strong> <span id="quote-expiry"></span></p>
                </div>

                <div class="explanation">
                    <h3>AI Pricing Explanation</h3>
                    <div id="price-explanation"></div>
                </div>

                <button id="execute-btn" onclick="executeTrade()">Execute Trade</button>
            </div>

            <div class="result-section" id="result-section" style="display: none;">
                <h2>Trade Execution Result</h2>
                <div id="trade-result"></div>
            </div>
        </div>
    </div>

    <!-- Add JavaScript directly in the HTML -->
    <script>
    const API_BASE = 'http://localhost:8001'; // Use your actual port

    let currentQuote = null;

    async function requestQuote() {
        console.log("Request Quote button clicked!");
        const isin = document.getElementById('isin-select').value;
        const side = document.querySelector('input[name="trade-type"]:checked').value;
        const quantity = parseInt(document.getElementById('quantity-input').value);

        try {
            const response = await fetch('/api/request-quote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ isin, side, quantity })
            });

            if (!response.ok) {
                throw new Error('Failed to get quote');
            }

            currentQuote = await response.json();
            displayQuote(currentQuote);

        } catch (error) {
            alert('Error getting quote: ' + error.message);
            console.error('Error:', error);
        }
    }

    function displayQuote(quote) {
        document.getElementById('quote-isin').textContent = quote.isin;
        document.getElementById('quote-side').textContent = quote.side;
        document.getElementById('quote-quantity').textContent = quote.quantity;
        document.getElementById('quote-price').textContent = quote.price.toFixed(2);
        document.getElementById('quote-total').textContent = (quote.quantity * quote.price).toFixed(2);

        const expiryDate = new Date(quote.expiration);
        document.getElementById('quote-expiry').textContent = expiryDate.toLocaleTimeString();

        // Display AI explanation
        const explanationDiv = document.getElementById('price-explanation');
        explanationDiv.innerHTML = `
            <p>The AI calculated a fair value of £${quote.explanation.fair_value.toFixed(2)} based on:</p>
            <ul>
                <li>Base value: £${quote.explanation.components.base_value.toFixed(2)}</li>
                <li>Time premium: £${quote.explanation.components.time_premium.toFixed(2)}</li>
                <li>Yield adjustment: £${quote.explanation.components.yield_adjustment.toFixed(2)}</li>
                <li>Risk adjustment: £${quote.explanation.components.risk_adjustment.toFixed(2)}</li>
                <li>Market movement: £${quote.explanation.components.market_move.toFixed(2)}</li>
            </ul>
            <p>Current benchmark yields: UK5Y=${(quote.explanation.benchmark_yields.UK5Y * 100).toFixed(2)}%,
            UK10Y=${(quote.explanation.benchmark_yields.UK10Y * 100).toFixed(2)}%</p>
        `;

        document.getElementById('quote-section').style.display = 'block';
        document.getElementById('result-section').style.display = 'none';
    }

    async function executeTrade() {
        if (!currentQuote) return;

        try {
            const response = await fetch('/api/execute-trade', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    isin: currentQuote.isin,
                    side: currentQuote.side,
                    quantity: currentQuote.quantity,
                    price: currentQuote.price
                })
            });

            if (!response.ok) {
                throw new Error('Failed to execute trade');
            }

            const result = await response.json();
            displayTradeResult(result);

        } catch (error) {
            alert('Error executing trade: ' + error.message);
        }
    }

    function displayTradeResult(result) {
        const resultDiv = document.getElementById('trade-result');

        if (result.status === 'success') {
            resultDiv.innerHTML = `
                <div class="success-message">
                    <h3>✅ Trade Executed Successfully!</h3>
                    <p><strong>Trade ID:</strong> ${result.tradeId}</p>
                    <p><strong>Status:</strong> ${result.details.status}</p>
                    <p><strong>Settled on:</strong> ${new Date(result.details.timestamp).toLocaleString()}</p>
                    <p><strong>Details:</strong> ${result.details.quantity} units of ${result.details.isin}
                    at £${result.details.price} each</p>
                    <p><strong>Message:</strong> ${result.message}</p>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="error-message">
                    <h3>❌ Trade Failed</h3>
                    <p>${result.message}</p>
                </div>
            `;
        }

        document.getElementById('result-section').style.display = 'block';
    }

    // Add event listeners when page loads
    document.addEventListener('DOMContentLoaded', function() {
        console.log("AI Liquidity Provider Demo loaded!");

        // Get Quote button
        const quoteBtn = document.getElementById('quote-btn');
        if (quoteBtn) {
            quoteBtn.addEventListener('click', requestQuote);
        }

        // Execute Trade button
        const executeBtn = document.getElementById('execute-btn');
        if (executeBtn) {
            executeBtn.addEventListener('click', executeTrade);
        }
    });
    </script>
</body>
</html>
